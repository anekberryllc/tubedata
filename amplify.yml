# AWS Amplify Hosting build spec.
#
# NOTE: AWS documents Next.js support as "12 through 15"; this app is on 16.
# If the build fails or the deployed app renders but SSR misbehaves, that
# version gap is the first suspect — not this file.
#
# Amplify must detect the app as WEB_COMPUTE (SSR), not a static site. It infers
# that from next.config.ts + the .next output below. If the console shows the
# platform as "Static", the deploy will 404 on every dynamic route.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # `npm ci` (not install) so the lockfile is authoritative in CI.
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
